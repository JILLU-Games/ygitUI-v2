<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YGIT - Project Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas-default: #0d1117;
      --canvas-subtle: #161b22;
      --canvas-inset: #090d13;
      --border-default: #30363d;
      --border-muted: #21262d;
      --border-active: #1d6cf6;
      --fg-default: #f0f6fc;
      --fg-muted: #8b949e;
      --fg-subtle: #7d8590;
      --brand-primary: #1d6cf6;
      --brand-primary-hover: #2f7af8;
      --accent-green-text: #3fb950;
      --accent-green-bg: rgba(63, 185, 80, 0.12);
      --radius-sm: 4px;
      --radius-md: 6px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body { background-color: var(--canvas-default); color: var(--fg-default); font-size: 13px; line-height: 1.4; }
    .app-layout { display: flex; min-height: 100vh; }
    .app-sidebar { width: 190px; flex-shrink: 0; background-color: var(--canvas-subtle); border-right: 1px solid var(--border-default); display: flex; flex-direction: column; justify-content: space-between; height: 100vh; position: sticky; top: 0; user-select: none; }
    .brand-header { padding: 10px 12px; border-bottom: 1px solid var(--border-muted); display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13px; }
    .brand-icon { width: 20px; height: 20px; background: var(--brand-primary); color: #fff; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
    .badge-plain { font-size: 9.5px; font-weight: 600; text-transform: uppercase; padding: 1px 5px; border-radius: var(--radius-sm); background: var(--border-muted); color: var(--fg-muted); border: 1px solid var(--border-default); }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); color: var(--fg-muted); text-decoration: none; font-size: 12px; }
    .nav-item.active { background: var(--border-muted); color: var(--fg-default); font-weight: 600; }
    .app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .app-header { height: 44px; border-bottom: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--canvas-subtle); }
    .btn { background: var(--border-muted); color: var(--fg-default); border: 1px solid var(--border-default); padding: 4px 10px; font-size: 11.5px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary { background: var(--brand-primary); color: #ffffff; border-color: rgba(255, 255, 255, 0.15); }
    .page-container { padding: 14px; display: flex; flex-direction: column; flex: 1; gap: 10px; max-width: 1400px; width: 100%; }
    .card { background: var(--canvas-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .form-input { background: var(--canvas-inset); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; color: var(--fg-default); outline: none; }
    .resource-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .resource-card { background: var(--canvas-inset); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .resource-card.active { border-color: var(--brand-primary); background: #0e1828; }
  </style>
</head>
<body>

<div class="app-layout">
  <aside class="app-sidebar">
    <div>
      <div class="brand-header">
        <a href="index.html" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg-default);">
          <div class="brand-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" /></svg>
          </div>
          <span>ygit.net</span>
        </a>
      </div>
      <div style="padding:8px;display:flex;flex-direction:column;gap:2px;">
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="projects.html" class="nav-item active">Projects</a>
      </div>
    </div>
    <div style="padding:8px 12px;border-top:1px solid var(--border-muted);font-size:10.5px;color:var(--accent-green-text);">
      ● Worker Online
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;">
        <a href="projects.html" style="color:var(--fg-muted);text-decoration:none;">Projects</a>
        <span style="color:var(--fg-subtle);">/</span>
        <strong id="displayProjectName">my-awesome-app</strong>
      </div>
    </header>

    <div class="page-container">
      <div class="card" id="emptyStateSection" style="align-items:center;justify-content:center;min-height:300px;text-align:center;">
        <div style="font-weight:600;margin-bottom:8px;">No repository attached</div>
        <button class="btn btn-primary" onclick="showResourcePicker()">+ Add Repo</button>
      </div>

      <div class="card" id="resourcePickerSection" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--border-muted);font-size:12px;font-weight:600;">
          <span>Choose Source</span>
          <button class="btn" style="padding:2px 6px;font-size:10.5px;" onclick="hideResourcePicker()">Back</button>
        </div>

        <div class="resource-grid">
          <div class="resource-card active" id="resCard-clone" onclick="selectResource('clone')">
            <strong style="font-size:12px;">Public Git Clone</strong>
          </div>
          <div class="resource-card" id="resCard-import" onclick="selectResource('import')">
            <strong style="font-size:12px;">Import Repo</strong>
          </div>
          <div class="resource-card" id="resCard-upload" onclick="selectResource('upload')">
            <strong style="font-size:12px;">Upload</strong>
          </div>
          <div class="resource-card" id="resCard-template" onclick="selectResource('template')">
            <strong style="font-size:12px;">Template</strong>
          </div>
        </div>

        <!-- CLONE WORKFLOW -->
        <div id="mockup-clone" style="display:flex;gap:6px;margin-top:6px;">
          <input type="text" class="form-input" style="flex:1;" value="https://github.com/vibtools/vib-agent" />
          <button class="btn btn-primary" onclick="runIntakePipeline('Git Clone')">Clone & Push</button>
        </div>

        <!-- IMPORT WORKFLOW -->
        <div id="mockup-import" style="display:none;flex-direction:column;gap:4px;margin-top:6px;">
          <div style="display:flex;justify-content:space-between;align-items:center;background:var(--canvas-inset);padding:6px 10px;border-radius:var(--radius-sm);">
            <span>vib-tools-web</span>
            <button class="btn btn-primary" onclick="runIntakePipeline('vib-tools-web')">Import</button>
          </div>
        </div>

        <!-- UPLOAD WORKFLOW -->
        <div id="mockup-upload" style="display:none;margin-top:6px;">
          <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="runIntakePipeline('Bundle')">Upload & Push</button>
        </div>

        <!-- TEMPLATE WORKFLOW -->
        <div id="mockup-template" style="display:none;grid-template-columns:repeat(4, 1fr);gap:6px;margin-top:6px;">
          <div style="background:var(--canvas-inset);padding:6px;border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center;">
            <span>Vite + React</span>
            <button class="btn btn-primary" onclick="runIntakePipeline('Vite+React')">Clone</button>
          </div>
        </div>

        <!-- INTAKE PROGRESS & SCAN TRIGGER -->
        <div id="intakeProgressBox" style="display:none;flex-direction:column;gap:6px;margin-top:8px;background:var(--canvas-inset);padding:10px;border-radius:var(--radius-sm);">
          <div style="display:flex;justify-content:space-between;font-size:11.5px;">
            <span id="intakeStatusText">Pushing to GitHub...</span>
            <span id="intakePercentText" style="font-family:var(--font-mono);font-weight:600;color:var(--brand-primary);">100%</span>
          </div>
          <button id="bigScanBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:8px;" onclick="goToScan()">
            Scan Repository →
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const pName = urlParams.get('name') || 'vib-tools-app';
  document.getElementById('displayProjectName').textContent = pName;

  function showResourcePicker() {
    document.getElementById('emptyStateSection').style.display = 'none';
    document.getElementById('resourcePickerSection').style.display = 'flex';
  }

  function hideResourcePicker() {
    document.getElementById('resourcePickerSection').style.display = 'none';
    document.getElementById('emptyStateSection').style.display = 'flex';
  }

  function selectResource(type) {
    ['clone', 'import', 'upload', 'template'].forEach(id => {
      document.getElementById('resCard-' + id).classList.remove('active');
      const m = document.getElementById('mockup-' + id);
      if (m) m.style.display = 'none';
    });
    document.getElementById('resCard-' + type).classList.add('active');
    const target = document.getElementById('mockup-' + type);
    if (target) target.style.display = (type === 'template' ? 'grid' : 'flex');
  }

  function runIntakePipeline(label) {
    const box = document.getElementById('intakeProgressBox');
    box.style.display = 'flex';
    document.getElementById('intakeStatusText').textContent = 'Pushed to GitHub';
  }

  function goToScan() {
    window.location.href = `project-scan.html?name=${encodeURIComponent(pName)}&repo=${encodeURIComponent('vibtools/' + pName)}`;
  }
</script>
</body>
</html>
